<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <circle cx="200" cy="150" r="100" fill="white" opacity="0.1"/>
  <g transform="translate(145, 65)" filter="url(#shadow2)">
    <!-- Smartwatch -->
    <rect x="35" y="0" width="40" height="150" rx="10" fill="#0f172a" opacity="0.8"/>
    <rect x="20" y="30" width="70" height="90" rx="20" fill="#ffffff"/>
    <rect x="26" y="36" width="58" height="78" rx="15" fill="#0f172a"/>
    <!-- Screen content -->
    <text x="55" y="75" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">10:45</text>
    <circle cx="55" cy="95" r="5" fill="#34d399"/>
  </g>
  <text x="200" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">SMART WATCH</text>
</svg>
