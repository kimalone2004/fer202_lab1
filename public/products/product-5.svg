<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg5)"/>
  <circle cx="200" cy="150" r="100" fill="white" opacity="0.1"/>
  <g transform="translate(145, 60)" filter="url(#shadow5)">
    <!-- Backpack -->
    <path d="M 30 40 C 30 10, 80 10, 80 40" fill="none" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <rect x="15" y="35" width="80" height="110" rx="20" fill="#1e293b"/>
    <rect x="25" y="85" width="60" height="50" rx="10" fill="#334155"/>
    <rect x="42" y="65" width="26" height="8" rx="4" fill="#fbbf24"/>
  </g>
  <text x="200" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">URBAN BACKPACK</text>
</svg>
